name: Build Mod

on:
  push:
    branches: [ main, fabric-1.21.1 ]
  pull_request:
    branches: [ main, fabric-1.21.1 ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build
        run: chmod +x gradlew && ./gradlew build --no-daemon
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: seasonaldaycycle
          path: build/libs/*.jar
